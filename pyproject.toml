[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "taskport"
version = "0.1.0"
description = "Small intranet task RPC with one-slot workers and central artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "hatchling>=1.27,<2"]

[project.scripts]
taskport = "taskport.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taskport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: real HTTP server and worker subprocesses"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
