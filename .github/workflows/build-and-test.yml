name: Build and test

on:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag to validate against the package version
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install '.[dev]'
      - name: Check release version
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          expected = f"v{version('taskport')}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} does not match {expected!r}")
          PY
      - name: Lint and formatting
        run: |
          python -m ruff check src tests examples
          python -m ruff format --check src tests examples
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata and README
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist
      - name: Install the built wheel with test dependencies
        run: >-
          python -c "from pathlib import Path; import subprocess, sys;
          wheel = next(Path('dist').glob('*.whl')).resolve();
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[dev]'])"
      - name: Verify the installed package and entry points
        run: |
          python -m pip check
          taskport --help
          python -m taskport --help
          python -c "from pathlib import Path; import taskport; from importlib.metadata import version; assert not Path(taskport.__file__).resolve().is_relative_to(Path('src').resolve()); assert taskport.__version__ == version('taskport')"
      - name: Run API and end-to-end tests against the wheel
        run: python -m pytest -q -p no:cacheprovider --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore
